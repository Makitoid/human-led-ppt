<!--
  human-led-ppt skill · 第 8 步 演讲者模式 / presenter mode (optional, additive block)
  ============================================================================
  这是什么：按 `S` 弹出一个独立演讲者窗口，顶部是一条固定横幅（计时 / 页码 /
  上一页 / 下一页 / 重置），下面四张磁吸卡——当前页 / 下一页 / 提示词 /
  总览（全部幻灯片的滚轮胶片条，点哪页跳哪页）；观众窗保持原样，两窗双向同步
  翻页。按 `N` 则在当前窗口下方拉出一条提词抽屉（弹窗被拦截时的退路）。
  What this is: `S` opens a separate presenter window — a fixed top banner (timer,
  page counter, prev / next / reset) plus four magnetic cards — current slide /
  next slide / speaker prompt / all-slide overview (a wheel-scrollable filmstrip,
  click to jump) — while the audience window
  stays as-is; both windows page in sync. `N` pulls a prompt drawer inside the
  current window (the fallback when popups are blocked).

  装法：node assets/assemble.cjs deck.src.html deck.html --presenter assets/presenter-overlay.html
  它只加自己的 DOM/CSS/JS，不改页面、不改 deck-shell.css/js。它依赖交互壳的两样东西：
  `window.__deck`（index/total/go）与 `?preview=N` 预览模式。放在 deck-shell 之后执行。

  批注联动（稿子同时装了 --ink 时才有）：当前页卡片的 iframe 放开 pointer-events，
  卡片头部多一枚「批注」按钮，直接在预览里开/关墨水层；presenter 在里面写的字走同一条
  ink:change 协议回到听众那一屏的同一份 store。笔迹同步走 ink 层的修订号协议
  （ink:change 事件 / {type:'ink-store'} / {type:'ink-cmd',cmd:'store'}），双窗最后写入者胜。
  黑板（`B`）只在听众窗里用：演讲者窗不再放第五张黑板卡——那块画面是镜像，不是舞台。
  视频全屏走的是同一条镜像路：在当前页卡里点全屏，演讲者窗的画面**不动**，只把请求转给听众窗，
  由听众窗去占住那一整块屏幕；当前页磁贴右上角亮一枚「视频全屏中」badge，点 badge 或再按一次
  全屏键就把屏幕还给听众窗（`media-fs` / `presenter-media-fs` / `preview-media-fs` /
  `audience-media-fs`，见 references/*/08-presenter-mode.md §3）。
  壳的 Q 快捷键面板打开时，本层把自己的键位注册进 window.__deckHelp。

  交付前只需要重写下面两个配置块：
    CONFIG 1 · COPY      —— 界面文案（卡片标题、空提示、底部提示条）
    CONFIG 2 · CANVAS/TOKEN_MAP —— 画布尺寸与本稿 token 名
  卡片的颜色**不是**内置的：它在打开演讲者窗的那一刻读本稿 :root 的实际色值，按底色亮度
  自动选深/浅两套卡片配方，所以工具窗和这份 PPT 天生同色系。不足 4.5:1 的颜色会自动退回
  默认值并写一条 console.warn——配色要测不要猜，这条也照样适用。
-->

<style>
/* ---------- audience-side only: prompt drawer + notice (the popup styles live
              inside the generated presenter document) ---------- */
#pv-drawer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:1200;
  width:min(1120px,94vw);max-height:44vh;overflow:auto;display:none;
  box-sizing:border-box;padding:16px 26px 20px;font-size:19px;line-height:1.8;
  border-radius:14px 14px 0 0;border:1px solid var(--pv-rule,rgba(128,128,128,.35));
  border-bottom:none;background:var(--pv-panel,#15181C);color:var(--pv-ink,#E8EAED);
  box-shadow:0 -12px 40px rgba(0,0,0,.35)}
#pv-drawer.open{display:block}
#pv-drawer .pv-h{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;opacity:.65;margin:0 0 10px}
#pv-drawer .pv-h b{font-weight:700}
#pv-drawer .pv-x{margin-left:auto;border:1px solid var(--pv-rule,rgba(128,128,128,.35));
  background:transparent;color:inherit;border-radius:6px;font:inherit;font-size:11px;
  padding:3px 9px;cursor:pointer;letter-spacing:.08em}
#pv-drawer p{margin:0 0 .75em}
#pv-drawer strong{color:var(--pv-warn,#D9A05B)}
#pv-drawer em{color:var(--pv-accent,#7AA2D9);font-style:normal}
#pv-drawer code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;
  background:rgba(128,128,128,.16);padding:1px 6px;border-radius:4px}
#pv-drawer .pv-empty{opacity:.5;font-style:italic}
#pv-drawer .pv-idx{font-variant-numeric:tabular-nums}
#pv-notice{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:1300;
  display:none;max-width:80vw;padding:12px 20px;border-radius:10px;font-size:15px;line-height:1.6;
  background:var(--pv-panel,#15181C);color:var(--pv-ink,#E8EAED);
  border:1px solid var(--pv-warn,#D9A05B)}
#pv-notice.show{display:block}
</style>

<script>
(function () {
  'use strict';

  /* ======================= CONFIG BLOCK 1 · COPY =======================
     Every string the presenter window and the drawer show to the speaker.
     Re-author for this deck: 提示词 card title, the empty-prompt line, the key
     hints. Language is auto-picked from <html lang> (zh / ja / en); keep the three
     objects in sync — if you only ever ship one language, delete the others. */
  var COPY = {
    zh: {
      cardCur: '当前页', cardNext: '下一页', cardPrompt: '提示词', cardOvw: '总览',
      winTitle: '演讲者视图',
      promptMeta: '本页主张', slideWord: '页', elapsed: '已讲',
      empty: '（这一页还没有提示词 — 见骨架 §7）',
      endOfDeck: '— 已是最后一页 —',
      hintPage: '翻页', hintReset: '重置计时', hintClose: '关闭',
      hintWheelKbd: '滚轮', hintWheel: '横扫总览 · 点击任意页跳过去',
      hintDrag: '拖动卡片标题栏移动 · 拖动右下角改变大小 · 位置自动记住',
      resetLayout: '重置布局', btnPrev: '← 上一页', btnNext: '下一页 →', btnReset: '⏱ 重置',
      blocked: '演讲者窗口被浏览器拦截了。允许弹出窗口后再按 S；或按 N 在页面下方用提词条。',
      drawer: '提词条', close: '关闭 (Esc)',
      noShell: '未检测到 deck-shell（window.__deck 不存在），演讲者模式未启用。',
      tokenMiss: '这些 token 在本稿 :root 里没找到，已回落到默认值：',
      contrastSwap: '这些颜色和卡片底色对比不足 4.5:1，已换成默认值（请检查本稿配色）：',
      inkBtn: '批注', inkBtnOn: '批注中',
      inkTip: '直接在左边这张当前页上批注，笔迹实时同步到听众那一屏；快捷键 Q 看全部键位',
      fsBadge: '视频全屏中', fsTip: '听众窗正在全屏播这段视频，当前页这张卡照旧；点一下把屏幕还给听众窗',
      helpSec: '演讲者模式',
      helpRows: [['S', '打开 / 关闭演讲者窗（批注关闭时）'], ['N', '页面下方提词条（弹窗被拦时）'], ['Esc', '关提词条']]
    },
    ja: {
      cardCur: '現在のページ', cardNext: '次のページ', cardPrompt: 'プロンプト', cardOvw: '総覧',
      winTitle: '発表者ウィンドウ',
      promptMeta: 'このページの主張', slideWord: 'ページ', elapsed: '全',
      empty: '（このページのプロンプトはまだありません —— 骨子 §7 を参照）',
      endOfDeck: '—— デッキの最後 ——',
      hintPage: 'ページ送り', hintReset: 'タイマーをリセット', hintClose: '閉じる',
      hintWheelKbd: 'ホイール', hintWheel: '総覧を横スクロール · クリックで任意のページへ',
      hintDrag: 'ヘッダーをドラッグで移動 · 右下の角でサイズ変更 · 位置は自動記憶',
      resetLayout: 'レイアウトをリセット', btnPrev: '← 前へ', btnNext: '次へ →', btnReset: '⏱ リセット',
      blocked: '発表者ウィンドウがブラウザにブロックされました。ポップアップを許可してから S を押し直すか、N でページ下部のプロンプトバーを使ってください。',
      drawer: 'プロンプトバー', close: '閉じる (Esc)',
      noShell: 'deck-shell が見つかりません（window.__deck が無い）—— 発表者モードは無効です。',
      tokenMiss: 'これらの token はこのデッキの :root に無いので既定値にフォールバックしました：',
      contrastSwap: 'これらの色はカードの下地との比較が 4.5:1 未満のため既定値に置き換えました（このデッキの配色を確認してください）：',
      inkBtn: '注記', inkBtnOn: '注記中',
      inkTip: '左の現在のページに直接書き込めます。筆跡は聴衆側へリアルタイムに同期します。Q ですべてのキー操作を表示。',
      fsBadge: '動画が全画面', fsTip: '聴衆側のウィンドウがこの映像を全画面で再生中です。このカードはそのまま。クリックで画面を戻します',
      helpSec: '発表者モード',
      helpRows: [['S', '発表者ウィンドウを開く / 閉じる（注記オフ時）'], ['N', 'ページ下部のプロンプトバー（ポップアップがブロックされたとき）'], ['Esc', 'プロンプトバーを閉じる']]
    },
    en: {
      cardCur: 'Current', cardNext: 'Next', cardPrompt: 'Prompt', cardOvw: 'Overview',
      winTitle: 'Presenter view',
      promptMeta: 'Claim', slideWord: 'slide', elapsed: 'elapsed',
      empty: '(no prompt for this slide yet — see skeleton §7)',
      endOfDeck: '— END OF DECK —',
      hintPage: 'navigate', hintReset: 'reset timer', hintClose: 'close',
      hintWheelKbd: 'Wheel', hintWheel: 'scroll the overview · click a slide to jump',
      hintDrag: 'drag a card header to move · drag its bottom-right corner to resize · layout is remembered',
      resetLayout: 'Reset layout', btnPrev: '← Prev', btnNext: 'Next →', btnReset: '⏱ Reset',
      blocked: 'The browser blocked the presenter window. Allow popups and press S, or press N for the in-page prompt bar.',
      drawer: 'Prompt bar', close: 'close (Esc)',
      noShell: 'deck-shell not detected (window.__deck missing) — presenter mode disabled.',
      tokenMiss: 'These tokens were absent from this deck\'s :root; defaults used: ',
      contrastSwap: 'These colours fell below 4.5:1 against this deck\'s panel and were replaced: ',
      inkBtn: 'Annotate', inkBtnOn: 'Inking',
      inkTip: 'Draw straight on the current-slide card; strokes sync live to the audience screen. Press Q for all shortcuts.',
      fsBadge: 'Video fullscreen', fsTip: 'The audience window has this clip on its screen; this card stays as it was. Click to hand the screen back.',
      helpSec: 'Presenter mode',
      helpRows: [['S', 'open / close the presenter window (annotation off)'], ['N', 'in-page prompt bar (when popups are blocked)'], ['Esc', 'close the prompt bar']]
    }
  };

  /* ======================= CONFIG BLOCK 2 · canvas + token map =========
     CANVAS must equal this deck's logical canvas (deck-shell defaults 1280×720);
     the previews scale by exactly this number, so a wrong value means wrong size
     inside the cards, not a wrong-looking slide. TOKEN_MAP names where this deck
     keeps its palette — rename here rather than editing the reader below. */
  var CANVAS = { w: 1280, h: 720 };
  var TOKEN_MAP = {
    bg: '--bg', panel: '--panel', ink: '--ink', muted: '--muted',
    accent: '--accent', warn: '--warn', rule: '--rule'
  };

  /* ================= do not edit below this line ====================== */

  var LANG = (function () {
    var l = (document.documentElement.lang || (navigator.language || '')).toLowerCase();
    return /^zh/.test(l) ? 'zh' : /^ja/.test(l) ? 'ja' : 'en';
  })();
  var T = COPY[LANG];
  var deck = window.__deck;
  if (!deck) { console.warn('[presenter] ' + T.noShell); return; }

  var slides = [].slice.call(document.querySelectorAll('#stage > .slide'));
  var pw = null, drawer = null, noticeEl = null, noticeTimer = null;

  function cs() { return getComputedStyle(document.documentElement); }

  /* resolve this deck's palette right now — the presenter window borrows it,
     which is why the tool window can never drift from the deck it belongs to */
  function resolveTokens() {
    var s = cs(), out = {}, missing = [];
    Object.keys(TOKEN_MAP).forEach(function (k) {
      var v = s.getPropertyValue(TOKEN_MAP[k]).trim();
      if (!v) { missing.push(TOKEN_MAP[k]); v = null; }
      out[k] = v;
    });
    var bodyFont = getComputedStyle(document.body).fontFamily || 'system-ui,sans-serif';
    return { pal: out, missing: missing, font: bodyFont };
  }

  function toRGB(v) {
    if (!v) return null;
    if (v.charAt(0) === '#') {
      var hex = v.slice(1);
      if (hex.length === 3) hex = hex.charAt(0) + hex.charAt(0) + hex.charAt(1) + hex.charAt(1) + hex.charAt(2) + hex.charAt(2);
      var n = parseInt(hex.slice(0, 6), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    var m = /\d+(\.\d+)?/g.exec(v);
    if (!m) return null;
    var p = v.match(/\d+(\.\d+)?/g) || [];
    return [+p[0], +p[1], +p[2]];
  }
  function lum(rgb) {
    if (!rgb) return null;
    var c = rgb.map(function (v) { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
    return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
  }

  function captionOf(s) {
    var k = s.querySelector('.kicker') || s.querySelector('.act');
    var h = s.querySelector('h1, h2');
    var a = k ? k.textContent.replace(/\s+/g, ' ').trim() : '';
    var b = h ? h.textContent.replace(/\s+/g, ' ').trim() : '';
    return (a && b ? a + ' · ' + b : (a || b)).slice(0, 60) || ('#' + (slides.indexOf(s) + 1));
  }
  function notesOf(s) {
    var n = s.querySelector('.notes, aside.notes');
    return n ? n.innerHTML : '';
  }

  function deckUrl() { return location.href.split('#')[0].split('?')[0]; }
  function embed(v) { return JSON.stringify(v).replace(/</g, '\\u003c'); }

  function showNotice(msg) {
    if (!noticeEl) {
      noticeEl = document.createElement('div');
      noticeEl.id = 'pv-notice';
      noticeEl.addEventListener('click', function (e) { e.stopPropagation(); }, false);
      document.body.appendChild(noticeEl);
    }
    noticeEl.textContent = msg;
    noticeEl.classList.add('show');
    if (noticeTimer) clearTimeout(noticeTimer);
    noticeTimer = setTimeout(function () { noticeEl.classList.remove('show'); }, 6500);
  }

  /* ---------------- prompt drawer (N) : same-window fallback ------------- */
  function ensureDrawer() {
    if (drawer) return drawer;
    drawer = document.createElement('div');
    drawer.id = 'pv-drawer';
    drawer.innerHTML = '<p class="pv-h"><b></b><span class="pv-idx"></span>' +
      '<button class="pv-x" type="button"></button></p><div class="pv-b"></div>';
    // stopPropagation on the drawer itself: a click bubbling to document would
    // otherwise be read by deck-shell as "click the left/right half" → page turn
    ['click', 'dblclick', 'touchstart', 'touchend'].forEach(function (ev) {
      drawer.addEventListener(ev, function (e) { e.stopPropagation(); }, false);
    });
    drawer.querySelector('.pv-x').addEventListener('click', function () { toggleDrawer(false); });
    document.body.appendChild(drawer);
    return drawer;
  }
  function fillDrawer() {
    if (!drawer) return;
    var i = deck.index;
    drawer.querySelector('.pv-h b').textContent = T.drawer;
    drawer.querySelector('.pv-idx').textContent = (i + 1) + ' / ' + deck.total;
    drawer.querySelector('.pv-x').textContent = T.close;
    drawer.querySelector('.pv-b').innerHTML = notesOf(slides[i]) || '<p class="pv-empty">' + T.empty + '</p>';
  }
  function toggleDrawer(force) {
    var el = ensureDrawer();
    var open = (force === undefined) ? !el.classList.contains('open') : !!force;
    el.classList.toggle('open', open);
    if (open) fillDrawer();
  }

  /* ---------------- presenter window ------------------------------------ */
  function openPresenter() {
    var ctx = buildContext();
    var html = buildHTML(ctx);
    try {
      pw = window.open('', 'human-led-ppt-presenter', 'width=1400,height=880,left=60,top=40');
    } catch (e) { pw = null; }
    if (!pw) { showNotice(T.blocked); return; }
    try {
      pw.document.open(); pw.document.write(html); pw.document.close();
    } catch (e) { pw = null; showNotice(T.blocked); return; }
    if (ctx.missing.length) console.warn('[presenter] ' + T.tokenMiss + ctx.missing.join(', '));
    if (ctx.swaps && ctx.swaps.length) console.warn('[presenter] ' + T.contrastSwap + ctx.swaps.join(', '));
  }
  function closePresenter() { if (pw && !pw.closed) { try { pw.close(); } catch (e) {} } pw = null; }
  function pushToPresenter(i) {
    if (pw && !pw.closed) { try { pw.postMessage({ type: 'deck-goto', idx: i }, '*'); } catch (e) {} }
  }

  function buildContext() {
    var r = resolveTokens();
    var bgRGB = toRGB(r.pal.bg);
    r.mode = (lum(bgRGB) !== null && lum(bgRGB) < 0.22) ? 'dark' : 'light';
    r.meta = slides.map(function (s, i) { return { title: captionOf(s), notes: notesOf(s) }; });
    r.canvas = CANVAS;
    r.copy = {
      cardCur: T.cardCur, cardNext: T.cardNext, cardPrompt: T.cardPrompt, cardOvw: T.cardOvw,
      promptMeta: T.promptMeta, elapsed: T.elapsed, empty: T.empty, endOfDeck: T.endOfDeck,
      hintPage: T.hintPage, hintReset: T.hintReset, hintClose: T.hintClose, hintDrag: T.hintDrag,
      resetLayout: T.resetLayout, btnPrev: T.btnPrev, btnNext: T.btnNext, btnReset: T.btnReset,
      slideWord: T.slideWord, winTitle: T.winTitle,
      inkBtn: T.inkBtn, inkBtnOn: T.inkBtnOn, inkTip: T.inkTip,
      fsBadge: T.fsBadge, fsTip: T.fsTip
    };
    r.deckTitle = document.title || '';
    r.deckUrl = deckUrl();
    r.idx = deck.index;
    r.total = deck.total;
    r.lang = LANG === 'zh' ? 'zh-CN' : LANG === 'ja' ? 'ja' : 'en';
    r.hasInk = !!(window.InkOverlay && window.InkOverlay.state);   /* annotation relay only makes sense with the ink layer */
    return r;
  }

  /* the presenter document is written into a blank popup, so it inherits this
     window's origin (matters on file://, where an absolute URL would not) */
  function buildHTML(c) {
    var p = c.pal;
    var DARK = c.mode === 'dark';
    function pal(k, darkV, lightV) { return p[k] || (DARK ? darkV : lightV); }
    /* the card surface is what every other colour has to clear, so resolve it first */
    var cardBg = pal('panel', '#181C21', '#FFFFFF');
    /* measured guard: a deck whose --accent (or --ink/--muted/--warn) is too close to
       its own panel colour would give an unreadable prompt card — the same invisible-text
       failure the shell warns about. Fall back to the mode default instead of shipping it. */
    function safe(v, fb) {
      var a = toRGB(v), b = toRGB(cardBg);
      if (!a || !b) return v || fb;
      var la = lum(a), lb = lum(b);
      return (Math.max(la, lb) + .05) / (Math.min(la, lb) + .05) >= 4.5 ? v : fb;
    }
    var fbInk = DARK ? '#E8EAED' : '#1B1B1B', fbMut = DARK ? '#9AA0A9' : '#5C5F66',
        fbAcc = DARK ? '#7AA2D9' : '#1F4FD8', fbWarn = DARK ? '#D9A05B' : '#8A5A00';
    var swaps = [];
    function guarded(k, v, fb) {
      var out = safe(v, fb);
      if (out !== v) swaps.push(TOKEN_MAP[k] + ' ' + v + '→' + fb);
      return out;
    }
    var cssVars = [
      '--s-bg:' + (DARK ? '#0E1013' : '#EDEDE9'),
      '--s-card:' + cardBg,
      '--s-ink:' + guarded('ink', pal('ink', fbInk, fbInk), fbInk),
      '--s-mut:' + guarded('muted', pal('muted', fbMut, fbMut), fbMut),
      '--s-accent:' + guarded('accent', pal('accent', fbAcc, fbAcc), fbAcc),
      '--s-warn:' + guarded('warn', pal('warn', fbWarn, fbWarn), fbWarn),
      '--s-rule:' + pal('rule', 'rgba(255,255,255,.14)', 'rgba(0,0,0,.14)'),
      '--font:' + c.font
    ].join(';');
    c.swaps = swaps;

    var body = '<!DOCTYPE html><html lang="' + c.lang + '"><head><meta charset="utf-8">' +
      '<title>' + T.winTitle + ' · ' + String(c.deckTitle).replace(/[<>]/g, '') + '</title><style>' +
      PRESENTER_CSS.split('/*__VARS__*/').join(cssVars) +
      '</style></head><body><div id="banner"><span id="t-clock">00:00</span>' +
      '<span class="b-meta"><span>' + T.slideWord + '</span><b id="t-count">–</b>' +
      '<span>' + T.elapsed + '</span><b id="t-total">–</b></span>' +
      '<span class="b-btns"><button id="b-prev">' + T.btnPrev + '</button>' +
      '<button id="b-next">' + T.btnNext + '</button>' +
      '<button id="b-reset">' + T.btnReset + '</button></span></div><div id="stage">' +
      card('cur', c.copy.cardCur, 'var(--s-accent)', '<iframe id="if-cur"></iframe>',
           c.hasInk ? '<button id="b-ink" type="button" title="' + c.copy.inkTip.replace(/"/g, '&quot;') + '"></button>' : '') +
      card('nxt', c.copy.cardNext, '#BC8CFF', '<iframe id="if-nxt"></iframe>') +
      card('pmt', c.copy.cardPrompt, 'var(--s-warn)', '<div id="pmt-body" class="scroller"></div>') +
      card('ovw', c.copy.cardOvw, '#54C08A', '<div id="ovw-strip"></div>') +
      '</div><div id="hint">' +
      '<span><kbd>← →</kbd> ' + T.hintPage + '</span>' +

    '    var sx=ev.clientX,sy=ev.clientY,ow=c.offsetWidth,oh=c.offsetHeight;',
    '    function mv(e){c.style.width=Math.max(MINW,ow+e.clientX-sx)+"px";',
    '      c.style.height=Math.max(MINH,oh+e.clientY-sy)+"px";',
    '      if(c.id==="c-ovw"){sizeOvw()}else{var f=c.querySelector("iframe");if(f)scaleOne(f)}}',
    '    function up(){c.classList.remove("sized");document.body.classList.remove("dragging");',
    '      document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);scaleAll();save()}',
    '    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up)})});',
    '/* ---- timer ---- */',
    'var t0=Date.now();',
    'function tick(){var s=Math.floor((Date.now()-t0)/1000);',
    '  el("t-clock").textContent=("0"+Math.floor(s/60)).slice(-2)+":"+("0"+(s%60)).slice(-2)}',
    'setInterval(tick,1000);tick();',
    'function resetTimer(){t0=Date.now();el("t-clock").textContent="00:00"}',
    '/* ---- controls ---- */',
    'if(el("b-ink")){setInkChip(false);el("b-ink").addEventListener("click",function(){setInkChip(!inkOn);sendInk({type:"ink-cmd",cmd:"on",arg:inkOn})})}',
    'if(el("fs-cur"))el("fs-cur").addEventListener("click",function(){askFs(false)});',
    'el("b-prev").addEventListener("click",function(){nav(idx-1)});',
    'el("b-next").addEventListener("click",function(){nav(idx+1)});',
    'el("b-reset").addEventListener("click",resetTimer);',
    'el("b-layout").addEventListener("click",function(){try{localStorage.removeItem(KEY)}catch(e){}apply(base());save()});',
    'document.addEventListener("keydown",function(e){if(e.ctrlKey||e.metaKey||e.altKey)return;',
    '  switch(e.key){case "ArrowRight":case "ArrowDown":case " ":case "PageDown":e.preventDefault();nav(idx+1);break;',
    '    case "ArrowLeft":case "ArrowUp":case "PageUp":e.preventDefault();nav(idx-1);break;',
    '    case "Home":nav(0);break;case "End":nav(total-1);break;',
    '    case "r":case "R":resetTimer();break;',
    '    /* Escape with the badge lit hands the screen back first — quitting the window while the',
    '       room is watching a clip nobody asked for is the worse of the two mistakes. */',
    '    case "Escape":if(mfs.on){askFs(false);break}window.close();break}});',
    '/* ---- boot: lay out first, then load each iframe exactly once ---- */',
    'apply(read());ovwBuild();fill();',
    'try{ifCur.src=C.deckUrl+"?preview="+(idx+1);',
    '  if(idx+1<total)ifNxt.src=C.deckUrl+"?preview="+(idx+2)}catch(e){console.error("[presenter] iframe:",e)}',
    'tellHost({type:"presenter-open"})',
    '})()'
  ].join('\n');

  /* ---------------- audience-side wiring --------------------------------- */
  function applyTokensToAudience() {
    var r = resolveTokens(), st = document.documentElement.style;
    [['--pv-panel', 'panel'], ['--pv-ink', 'ink'], ['--pv-mut', 'muted'],
     ['--pv-accent', 'accent'], ['--pv-warn', 'warn'], ['--pv-rule', 'rule']].forEach(function (pair) {
      var v = r.pal[pair[1]];
      if (v) st.setProperty(pair[0], v);
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key === 's' || e.key === 'S') {
      if (deck.preview) return;
      e.preventDefault(); e.stopPropagation();
      openPresenter();
      return;
    }
    if (e.key === 'n' || e.key === 'N') {
      if (deck.preview) return;
      e.preventDefault(); e.stopPropagation();
      toggleDrawer();
      return;
    }
    if (e.key === 'Escape' && drawer && drawer.classList.contains('open')) { toggleDrawer(false); }
  }, true);

  window.addEventListener('deck:go', function (e) {
    pushToPresenter(e.detail.index);
    if (drawer && drawer.classList.contains('open')) fillDrawer();
  });

  /* ink relay: while the presenter window is open, strokes drawn in EITHER window
     must land in both. The ink layer fires 'ink:change' on every save here, and the
     presenter window forwards its own preview strokes back as {type:'ink-store'};
     revisions inside the ink layer make this last-write-wins without echo loops. */
  function pushInk() {
    var s = window.InkOverlay && window.InkOverlay.state ? window.InkOverlay.state() : null;
    if (s && pw && !pw.closed) { try { pw.postMessage({ type: 'ink-store', store: s.store, rev: s.rev }, '*'); } catch (e) {} }
  }
  window.addEventListener('ink:change', function (e) {
    if (pw && !pw.closed) { try { pw.postMessage({ type: 'ink-store', store: e.detail.store, rev: e.detail.rev }, '*'); } catch (err) {} }
  });

  /* fullscreen relay: the audience window is the one that can own a screen, so it is also the
     one that decides what the badge on the 当前页 tile says. deck-shell.js broadcasts
     'audience-media-fs' from every path that changes that state — its own button, a double
     click, the bridge, Escape, a page turn — and this is the only thing that forwards it. */
  function pushFs() {
    var i = deck.mediaBig;
    if (i >= 0 && pw && !pw.closed) { try { pw.postMessage({ type: 'media-fs', id: i, on: true }, '*'); } catch (e) {} }
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;
    if (d.type === 'presenter-goto') {
      if (d.idx !== deck.index) deck.go(d.idx);
    } else if (d.type === 'presenter-open') {
      pushToPresenter(deck.index);
      pushInk();
      pushFs();
    } else if (d.type === 'presenter-close') {
      pw = null;
    } else if (d.type === 'audience-media-fs') {
      if (pw && !pw.closed) { try { pw.postMessage({ type: 'media-fs', id: d.id, on: d.on }, '*'); } catch (e) {} }
    } else if (d.type === 'ink-store') {
      if (window.InkOverlay && window.InkOverlay.applyRemote) window.InkOverlay.applyRemote(d.store, d.rev);
    }
  });

  /* register this layer's keys with the shell's Q panel (see deck-shell.js) */
  if (window.__deckHelp) window.__deckHelp.push({ title: T.helpSec, rows: T.helpRows });

  window.addEventListener('beforeunload', closePresenter);
  applyTokensToAudience();

  window.Presenter = {
    open: openPresenter, close: closePresenter,
    toggleDrawer: toggleDrawer,
    get isOpen() { return !!(pw && !pw.closed); },
    get drawerOpen() { return !!(drawer && drawer.classList.contains('open')); },
    context: buildContext
  };
})();
</script>
