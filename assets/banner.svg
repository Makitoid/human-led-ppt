<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">human-led-ppt — You lead. The agent builds.</title>
  <desc id="banner-desc">human-led-ppt 2.0.1, a human-led, agent-assisted presentation design system. A paper-white editorial layout pairs the project name with a stack of presentation slides and an editable native PPTX card. HTML is the primary delivery format; native PPTX is available when needed. The five-step workflow is Topic, Style, Evidence, Skeleton, then Build, with your approval required before building.</desc>

  <!-- Self-contained artwork: system fonts, solid fills, no scripts or external assets. -->
  <defs>
    <clipPath id="banner-clip">
      <rect width="1280" height="480" rx="24"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #14281F; }
    .muted { fill: #58695F; }
    .serif { font-family: Georgia, "Times New Roman", serif; }
    .small { font-size: 14px; }
    .label { font-size: 16px; }
    .step { font-size: 18px; font-weight: 600; }
    .number { font-size: 13px; fill: #58695F; }
    .connector { fill: none; stroke: #C8D1C9; stroke-width: 1.5; }
  </style>

  <g clip-path="url(#banner-clip)">
    <rect width="1280" height="480" fill="#F7F5F0"/>

    <!-- Brand: a clear name, one promise, and two delivery formats. -->
    <text x="56" y="65" class="label muted">A presentation design system</text>
    <rect x="565" y="44" width="74" height="28" rx="14" fill="none" stroke="#C8D1C9"/>
    <text x="602" y="63" class="small muted" text-anchor="middle">v2.0.1</text>
    <text x="52" y="145" font-size="76" font-weight="700" letter-spacing="-3.4">human-led-ppt</text>
    <text x="56" y="209" class="serif" font-size="34">You lead. The agent builds.</text>
    <text x="56" y="252" font-size="19" class="muted">Evidence-backed slides, shaped by you.</text>

    <rect x="56" y="291" width="167" height="37" rx="8" fill="#0F766E"/>
    <text x="73" y="315" font-size="17" font-weight="600" style="fill: #FFFFFF">HTML</text>
    <text x="132" y="315" font-size="15" style="fill: #FFFFFF">primary</text>
    <text x="245" y="315" font-size="17" font-weight="600">PPTX</text>
    <text x="302" y="315" font-size="15" class="muted">native compatibility</text>
    <text x="56" y="356" class="label muted">Your story. Your evidence. Your final say.</text>

    <!-- The product in miniature: a slide, a human annotation, an editable file. -->
    <rect x="674" y="40" width="550" height="320" rx="20" fill="#173F35"/>
    <rect x="719" y="59" width="480" height="252" rx="9" fill="#82A99A"/>
    <rect x="707" y="69" width="480" height="252" rx="9" fill="#DCE6DC"/>
    <rect x="695" y="79" width="480" height="252" rx="9" fill="#FDFCFA"/>
    <text x="729" y="111" class="small muted">The story starts with you.</text>
    <text x="1141" y="111" class="small" text-anchor="end" style="fill: #0F766E; font-weight: 600">.html</text>
    <text x="727" y="174" class="serif" font-size="53" letter-spacing="-1.5">Make your</text>
    <text x="727" y="232" class="serif" font-size="53" letter-spacing="-1.5">point.</text>

    <!-- A restrained pen mark carries the human-led idea. -->
    <path d="M729 245 C775 239 831 239 869 244 M740 252 C777 247 824 246 853 249" fill="none" stroke="#B45309" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="729" y1="278" x2="997" y2="278" stroke="#DDE2D9"/>
    <circle cx="735" cy="300" r="6" fill="#E4EFE8"/>
    <path d="m732 300 2 2 4-4" fill="none" stroke="#0F766E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="750" y="305" class="small muted">Every claim has a source.</text>

    <!-- Native objects represented by an editable title and selection handles. -->
    <rect x="1033" y="229" width="170" height="116" rx="10" fill="#FDFCFA" stroke="#CBD8CD"/>
    <text x="1049" y="254" class="small" font-weight="600" style="fill: #9A440B">.pptx</text>
    <text x="1187" y="254" font-size="12" text-anchor="end" class="muted">native</text>
    <rect x="1051" y="270" width="134" height="25" fill="#EAF1EC" stroke="#0F766E" stroke-width="1"/>
    <text x="1061" y="287" font-size="12" font-weight="600">Your next chapter</text>
    <g fill="#FDFCFA" stroke="#0F766E" stroke-width="1">
      <rect x="1048.5" y="267.5" width="5" height="5"/>
      <rect x="1182.5" y="267.5" width="5" height="5"/>
      <rect x="1048.5" y="292.5" width="5" height="5"/>
      <rect x="1182.5" y="292.5" width="5" height="5"/>
    </g>
    <text x="1049" y="324" font-size="13" class="muted">Made to stay editable.</text>

    <!-- One shared process. Approval is explicitly between skeleton and build. -->
    <rect y="390" width="1280" height="90" fill="#EFEEE7"/>
    <line x1="56" y1="390.5" x2="1224" y2="390.5" stroke="#DDE0D5"/>
    <text x="56" y="441" class="number">01</text>
    <text x="84" y="441" class="step">Topic</text>
    <path d="M145 435 H217" class="connector"/>
    <text x="242" y="441" class="number">02</text>
    <text x="270" y="441" class="step">Style</text>
    <path d="M331 435 H403" class="connector"/>
    <text x="428" y="441" class="number">03</text>
    <text x="456" y="441" class="step">Evidence</text>
    <path d="M547 435 H599" class="connector"/>
    <text x="624" y="441" class="number">04</text>
    <text x="652" y="441" class="step">Skeleton</text>
    <path d="M741 435 H796" class="connector" stroke-dasharray="3 5"/>
    <rect x="815" y="415" width="196" height="40" rx="20" fill="#E1EAE0"/>
    <path d="m835 435 5 5 9-11" fill="none" stroke="#0F766E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="860" y="441" font-size="17" font-weight="600" style="fill: #205B48">Your approval</text>
    <path d="M1030 435 H1090" class="connector" stroke-dasharray="3 5"/>
    <text x="1114" y="441" class="number">05</text>
    <text x="1142" y="441" class="step">Build</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="479" rx="23.5" fill="none" stroke="#14281F" stroke-opacity="0.12"/>
</svg>
