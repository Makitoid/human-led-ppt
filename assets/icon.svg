<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">human-led-ppt</title>
  <desc id="d">Two stacked slide cards with a rising chart; an orange hand-drawn ring circles the peak — a deck you can present and annotate. Colours are the skill's own deck-shell tokens.</desc>
  <!-- palette: deck-shell.css :root  ·  ink #14281F · paper #F7F5F0 · accent #0F766E · warn #B45309 -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="#14281F"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#F7F5F0" stroke-opacity=".10" stroke-width="2"/>
  <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="104"/></clipPath>
  <g clip-path="url(#tile)"><circle cx="352" cy="150" r="150" fill="#0F766E" opacity=".16"/></g>

  <!-- deck: the slide behind -->
  <g opacity=".55">
    <rect x="150" y="118" width="256" height="164" rx="16" fill="#0F766E" opacity=".38"/>
    <rect x="180" y="146" width="112" height="14" rx="7" fill="#F7F5F0" opacity=".5"/>
    <rect x="180" y="172" width="64" height="10" rx="5" fill="#F7F5F0" opacity=".28"/>
  </g>
  <!-- the current slide -->
  <rect x="104" y="156" width="288" height="192" rx="16" fill="#F7F5F0"/>
  <rect x="136" y="188" width="140" height="24" rx="12" fill="#14281F"/>
  <rect x="136" y="216" width="88" height="16" rx="8" fill="#14281F" opacity=".32"/>
  <rect x="136" y="316" width="224" height="1" fill="#14281F" opacity=".14"/>
  <!-- the chart: 主张 + 数据 -->
  <polyline points="140,300 196,276 250,286 306,236" fill="none" stroke="#0F766E" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="306" cy="236" r="15" fill="#0F766E"/>
  <!-- annotation: circling the number that matters, on screen, while talking -->
  <path d="M336 206 C 300 194 262 214 260 244 C 258 276 296 296 328 284 C 356 274 366 244 352 222"
        fill="none" stroke="#B45309" stroke-width="22" stroke-linecap="round"/>
  <path d="M336 206 L 350 198 M336 206 L 344 220" fill="none" stroke="#B45309" stroke-width="18" stroke-linecap="round"/>
</svg>
