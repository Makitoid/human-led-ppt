<!-- ═══════════════════════════════════════════════════════════════════════════
  human-led-ppt skill · screen annotation overlay (ink layer) — OPTIONAL feature block
  可选功能块：屏幕批注

  Install: paste this whole file immediately before </body> of the finished deck
  (or run  node assets/assemble.cjs in.html out.html --ink assets/ink-overlay.html ).
  It is additive: it never edits the deck's DOM, CSS or deck-shell.js.

  Before shipping, edit ONLY the two config blocks:
    · CSS  :root--ink  → map onto the deck's own tokens (see references/(en|zh)/07-annotation.md §2)
    · JS   PALETTE / SIZE / L → the 5 hard colours picked from the deck palette,
                                the two pen ranges, and the runtime strings (auto zh/en)

  Provides: A or the corner button toggles annotation · pen · highlighter · eraser with two
  modes (whole stroke / scrub ink) · 5 fixed + 1 custom colour · per-tool remembered thickness
  in a popover · undo/redo/clear · hide ink · export PNG/JSON + import · per-slide storage in
  localStorage · keyboard paging stays live while annotating, mouse paging is suspended.
  B or the board button raises a dark BLACKBOARD over the whole page: the deck is
  hidden, the same pens keep working, and the strokes go to one shared scratch surface
  (`bd`) instead of to slide N. The board is ALWAYS this one dark slate whatever the deck
  is, so it carries its own chalk palette (PALETTE_BOARD) — the deck's own pen set is tuned
  for the deck surface, and whatever sits in its darkest slot would simply vanish.
  In the presenter window the board is its own fifth card.
  The corner button is draggable (its position is remembered per deck in `ink.v1.fab|<title>`,
  double-click resets it) and keeps the plain pen glyph. The toolbar's on/off button carries a
  ⏻ power glyph — ending annotation closes the layer, so the glyph says what the click does —
  and it never takes the selected-state frame. assets/icon.svg stays the skill's own logo and is
  not embedded in the toolbar.
  Inside a `?preview=N` iframe (the presenter window's cards) the layer also syncs: strokes
  drawn there are broadcast to the host deck and vice versa (revision-guarded, last write wins).
  `?preview=N&board=1` boots straight into the board, which is how the presenter's board card
  is built — same engine, same store, so board strokes ride the existing sync protocol for free.

  Comments are English for cross-language agents; user-visible strings come from L.
═══════════════════════════════════════════════════════════════════════════════ -->
<style>
  /* ─── CONFIG BLOCK 1 · theme ────────────────────────────────────────────────
     Map these onto the deck's :root so the bar reads as part of the deck.
     Light deck  → light acrylic (white surface, dark ink, dark hairline).
     Dark deck   → dark acrylic  (dark surface, light ink, light hairline).
     Never ship the defaults blindly: verify the ink/mut contrast (≥4.5:1 for the
     12–13px labels) against --ink-surface composited on the deck background.      */
  #inkc,#inkbar,#inkfab,#inkmenu,#inkpop,#inkstatus,#inkhint,#inkhelp,#inkboard{
    --ink-surface:rgba(17,27,24,.66);      /* deck --panel + alpha                    */
    --ink-tint:rgba(79,209,197,.13);       /* deck --accent, low alpha, top gradient  */
    --ink-line:rgba(255,255,255,.15);      /* hairline                                */
    --ink-hi:rgba(255,255,255,.17);        /* inner highlight, top edge               */
    --ink-lo:rgba(0,0,0,.28);              /* inner shade, bottom edge                */
    --ink-ink:#EAF1EC;                     /* primary label / icon colour             */
    --ink-mut:#9FB0A6;                     /* secondary                               */
    --ink-accent:#4FD1C5;                  /* deck --accent, selected states          */
    --ink-on-bg:rgba(79,209,197,.20);
    --ink-on-line:rgba(79,209,197,.62);
    --ink-warn:#E0A24A;                    /* deck --warn, used by status messages    */
    --ink-blur:26px; --ink-sat:180%;
    --ink-shadow:0 20px 52px rgba(0,0,0,.62);
    --ink-font:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;  /* chrome font only */
    /* blackboard: deliberately NOT derived from the deck palette — the board is always
       this one dark slate whatever the deck is, so it needs its own surface + its own
       chalk pen set. BOARD_BG in the config block must equal the value below.           */
    --ink-board:#1D2A26;
  }

  /* ─── blackboard: one dark surface over the whole page, under the ink canvas ──
     A faint top-left sheen keeps it reading as a board rather than a dead black rectangle;
     it lifts the surface by ~4% white at its brightest, which the chalk palette's 4.5:1
     measurements already account for.                                                   */
  #inkboard{
    position:fixed;inset:0;z-index:8998;display:none;
    background:radial-gradient(120% 90% at 22% 8%,rgba(255,255,255,.045),rgba(255,255,255,0) 58%),var(--ink-board);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 2px 22px rgba(0,0,0,.45);
  }
  body.board #inkboard{display:block}

  /* ─── canvas ──────────────────────────────────────────────────────────────── */
  #inkc{position:fixed;inset:0;z-index:9000;width:100%;height:100%;pointer-events:none;touch-action:none;display:block}
  body.inking #inkc{pointer-events:auto;cursor:crosshair}
  body.inking{user-select:none}
  body.inking.tk-e #inkc{cursor:none}
  /* the overview wall and the Q shortcut panel own the screen: hide every ink surface
     via sibling selectors (both elements are created before this block in the DOM) */
  #overview.open ~ #inkc,#overview.open ~ #inkbar,#overview.open ~ #inkfab,#overview.open ~ #inkmenu,
  #overview.open ~ #inkpop,#overview.open ~ #inkhint,#overview.open ~ #inkhelp,#overview.open ~ #inkstatus,
  #overview.open ~ #inkboard,
  #deckhelp.open ~ #inkc,#deckhelp.open ~ #inkbar,#deckhelp.open ~ #inkfab,#deckhelp.open ~ #inkmenu,
  #deckhelp.open ~ #inkpop,#deckhelp.open ~ #inkhint,#deckhelp.open ~ #inkhelp,#deckhelp.open ~ #inkstatus,
  #deckhelp.open ~ #inkboard{display:none !important}

  /* ─── acrylic: blur + saturate + tint + noise + inner highlight ───────────── */
  .acrylic{
    background-color:var(--ink-surface);
    background-image:
      linear-gradient(180deg,var(--ink-tint),rgba(0,0,0,0) 58%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.055'/></svg>");
    background-blend-mode:normal,overlay;
    backdrop-filter:blur(var(--ink-blur)) saturate(var(--ink-sat));
    -webkit-backdrop-filter:blur(var(--ink-blur)) saturate(var(--ink-sat));
    border:1px solid var(--ink-line);
    box-shadow:inset 0 1px 0 var(--ink-hi),inset 0 -1px 0 var(--ink-lo),var(--ink-shadow);
  }
  /* popovers live at body level: a backdrop-filter ancestor becomes the containing
     block for fixed descendants, which silently misplaces them */
  .inkfloat{
    position:fixed;left:0;bottom:0;transform:translateX(-50%);z-index:9004;display:none;
    width:max-content;font-family:var(--ink-font);font-size:13px;color:var(--ink-ink);letter-spacing:.02em;
  }
  body.inking .inkfloat.open{display:flex}

  /* ─── persistent toggle: the only entry point when not annotating ─────────── */
  #inkfab{
    position:fixed;right:20px;bottom:20px;width:38px;height:38px;padding:0;z-index:9002;
    display:grid;place-items:center;border-radius:12px;cursor:grab;opacity:.5;color:var(--ink-ink);
    touch-action:none;                        /* the button itself is draggable */
    transition:opacity .18s,transform .14s;
  }
  #inkfab:hover,#inkfab:focus-visible{opacity:1;transform:translateY(-1px)}
  #inkfab.dragging{transition:none;opacity:1;transform:none;cursor:grabbing}
  #inkfab:focus-visible{outline:2px solid var(--ink-accent);outline-offset:2px}
  #inkfab svg{width:19px;height:19px;display:block}
  body.inking #inkfab{display:none}

  /* ─── toolbar: always one row; grows sideways, never taller ───────────────── */
  #inkbar{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9002;
    display:none;align-items:center;gap:5px;padding:8px 10px;border-radius:14px;
    width:max-content;flex-wrap:nowrap;white-space:nowrap;      /* shrink-to-fit would squeeze it */
    font-family:var(--ink-font);font-size:13px;color:var(--ink-ink);letter-spacing:.02em;
  }
  body.inking #inkbar{display:flex}
  #inkbar .ib-sep{width:1px;height:24px;background:var(--ink-line);margin:0 4px;flex:none}
  #inkbar button{
    flex:none;width:34px;height:32px;display:grid;place-items:center;border-radius:9px;
    background:transparent;border:1px solid transparent;color:var(--ink-ink);cursor:pointer;opacity:.86;
    transition:background .14s,opacity .14s,border-color .14s,transform .1s;
  }
  #inkbar button:hover{background:var(--ink-on-bg);opacity:1}
  #inkbar button:active{transform:translateY(1px)}
  #inkbar button:focus-visible{outline:2px solid var(--ink-accent);outline-offset:2px}
  /* nudge the ⏻ off the toolbar's left edge so it breathes like the other groups */
  #inkbar [data-act="toggle"]{margin-left:5px}
  /* the board button takes no tool-style selection: like ⏻ it is a mode switch, and it
     keeps its own accent wash so "board is up" reads at a glance */
  #inkbar [data-act="board"].on{color:var(--ink-accent);border-color:var(--ink-on-line)}
  #inkbar button.on{background:var(--ink-on-bg);border-color:var(--ink-on-line);color:var(--ink-ink);opacity:1;box-shadow:inset 0 1px 0 var(--ink-hi)}
  #inkbar button svg{width:17px;height:17px;display:block}
  /* the redrawn highlighter is a filled silhouette, not a stroke drawing */
  #inkbar button svg rect,#inkbar button svg path{vector-effect:non-scaling-stroke}
  #inkbar .sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-line)}
  #inkbar .sw.on{border-color:var(--ink-ink);box-shadow:0 0 0 2px var(--ink-lo)}
  /* 6th swatch is user-defined: dashed ring is the "pick your own" idiom */
  #inkbar .sw.custom{border-color:var(--ink-line);border-style:dashed}
  #inkbar .sw.custom.on{border-color:var(--ink-ink)}
  #inkbar input[type=color]{position:absolute;width:0;height:0;opacity:0;border:0;padding:0;pointer-events:none}
  /* eraser button carries two glyphs; only one shows per mode */
  #inkbar [data-tool="e"] .ic-i{display:none}
  body.er-i #inkbar [data-tool="e"] .ic-s{display:none}
  body.er-i #inkbar [data-tool="e"] .ic-i{display:block}

  /* ─── eraser mode popover: two names, nothing else ────────────────────────── */
  #inkmenu{flex-direction:column;gap:2px;padding:5px;border-radius:11px}
  #inkmenu button{
    width:auto;height:auto;display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:8px;
    background:transparent;border:1px solid transparent;color:var(--ink-ink);opacity:.8;text-align:left;
    font:inherit;letter-spacing:.03em;cursor:pointer;transition:background .14s,opacity .14s,border-color .14s;
  }
  #inkmenu button:hover{background:var(--ink-on-bg);opacity:1}
  #inkmenu button:focus-visible{outline:2px solid var(--ink-accent);outline-offset:2px}
  #inkmenu button svg{width:16px;height:16px;flex:none;display:block}
  #inkmenu button b{font-weight:700}
  #inkmenu button.on{background:var(--ink-on-bg);border-color:var(--ink-on-line);opacity:1}

  /* ─── thickness popover: one slider + one number, no prose ────────────────── */
  #inkpop{align-items:center;gap:11px;padding:9px 13px;border-radius:11px}
  #inkpop input[type=range]{-webkit-appearance:none;appearance:none;width:132px;height:22px;background:transparent;cursor:pointer;flex:none;margin:0}
  #inkpop input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:99px;background:var(--ink-line)}
  #inkpop input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink-ink);border:1px solid var(--ink-lo);margin-top:-5px}
  #inkpop input[type=range]::-moz-range-track{height:3px;border-radius:99px;background:var(--ink-line)}
  #inkpop input[type=range]::-moz-range-thumb{width:13px;height:13px;border:1px solid var(--ink-lo);border-radius:50%;background:var(--ink-ink)}
  #inkpop input[type=range]:focus-visible{outline:2px solid var(--ink-accent);outline-offset:4px;border-radius:6px}
  #inkpop b{font-weight:700;font-size:13px;color:var(--ink-ink);min-width:24px;text-align:right;font-variant-numeric:tabular-nums}

  /* ─── status pill: appears only when there is something to report ─────────── */
  #inkstatus{
    position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:9002;display:none;
    max-width:calc(100vw - 32px);padding:7px 14px;border-radius:10px;white-space:nowrap;
    font-family:var(--ink-font);font-size:12.5px;color:var(--ink-ink);
  }
  #inkstatus.show{display:block}
  #inkstatus em{font-style:normal;color:var(--ink-warn)}

  /* ─── first-run hint + shortcut card (text injected by JS from L) ─────────── */
  #inkhint{
    position:fixed;right:20px;bottom:68px;z-index:9001;padding:9px 15px;border-radius:11px;
    font-family:var(--ink-font);font-size:13.5px;color:var(--ink-ink);max-width:320px;line-height:1.55;
  }
  #inkhint kbd{font:inherit;font-weight:700;color:var(--ink-surface);background:var(--ink-accent);border-radius:4px;padding:0 5px;margin:0 2px}
  #inkhint.off{display:none}
  #inkhelp{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9003;display:none;
    width:min(640px,calc(100vw - 40px));border-radius:16px;padding:22px 26px 18px;
    font-family:var(--ink-font);color:var(--ink-ink);
  }
  #inkhelp.open{display:block}
  #inkhelp h4{margin:0 0 4px;font-size:17px;letter-spacing:.06em;color:var(--ink-accent)}
  #inkhelp p.sub{margin:0 0 16px;font-size:12.5px;color:var(--ink-mut);line-height:1.6}
  #inkhelp .hg{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px}
  #inkhelp .hr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px dashed var(--ink-line);padding-bottom:5px;font-size:13px}
  #inkhelp kbd{font:700 12px/1.6 "Segoe UI",system-ui,sans-serif;color:var(--ink-surface);background:var(--ink-accent);border-radius:5px;padding:1px 6px;white-space:nowrap}
  #inkhelp .hfoot{margin-top:14px;padding-top:10px;border-top:1px solid var(--ink-line);font-size:12px;color:var(--ink-mut);display:flex;justify-content:space-between;align-items:baseline;gap:16px}
  #inkhelp .hfoot b{color:var(--ink-warn);font-weight:700}

  /* ─── narrow projectors: drop secondary buttons, never wrap ───────────────── */
  @media (max-width:1020px){
    #inkbar{gap:4px;padding:7px 8px}
    #inkbar button{width:31px;height:30px}
  }
  @media (max-width:860px){ #inkbar [data-act="json"],#inkbar [data-act="import"],#inkhint{display:none} }
  @media (max-width:720px){ #inkbar [data-act="png"]{display:none} }
  /* sit the bar a little right of centre — only when there is slack to spare, so a narrow
     window never pushes its last button off screen */
  @media (min-width:900px){ #inkbar{transform:translateX(calc(-50% + 8px))} }
  @media (prefers-reduced-motion:reduce){ #inkbar button,#inkfab,#inkmenu button{transition:none} }
  /* annotations are a live-canvas overlay: they stay out of print/PDF on purpose */
  @media print{ #inkc,#inkbar,#inkfab,#inkmenu,#inkpop,#inkhint,#inkhelp,#inkstatus,#inkboard{display:none !important} }
</style>

<canvas id="inkc" aria-hidden="true"></canvas>
<div id="inkboard" aria-hidden="true"></div>

<button id="inkfab" class="acrylic" aria-pressed="false">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l1-3.2 8.1-8.1a1.8 1.8 0 012.6 2.6L7.7 15 4 16z"/><path d="M12.3 5.9l2.3 2.3"/></svg>
</button>

<div id="inkbar" class="acrylic" role="toolbar">
  <!-- the on/off button wears the skill's tile (inlined from assets/icon.svg — keep in sync),
       in two variants: JS sets data-mode from this deck's own --bg luminance (0.22 line) -->
  <button data-act="toggle" aria-pressed="true">
    <!-- 关机符号（IEC power）：开口圆弧 + 顶部竖线。它的动作是"关掉批注这一层" -->
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15.3 5.5a7.5 7.5 0 1 1-10.6 0"/><path d="M10 1.7v8.3"/></svg>
  </button>

  <span class="ib-sep"></span>
  <!-- 钢笔 = 斜笔身 + 笔尖下一道波浪线；荧光笔 = 实心斜切笔身 + 笔尖压出的那条色带，
       两者靠"有没有那条色带"区分，17px 下必须一眼可辨 -->
  <button data-tool="p" class="on">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16l1-3.2 8.1-8.1a1.8 1.8 0 012.6 2.6L7.7 15 4 16z"/><path d="M2.4 18.4c1.5-1.2 2.3.9 3.7-.3 1.4-1.2 2.3.9 3.7-.3 1.4-1.2 2.3.9 3.7-.3"/></svg>
  </button>
  <button data-tool="m">
    <!-- 荧光笔（重画）：笔身整块填充，帽身分界留一道真空隙，笔尖是斜切梯形，
         笔尖下方压一条粗色带——色带才是"荧光笔"的辨识特征，钢笔没有它 -->
    <svg viewBox="0 0 20 20"><g transform="rotate(45 10 9)" fill="currentColor"><rect x="8.1" y="2.3" width="3.8" height="2.6" rx=".5"/><rect x="8.4" y="6" width="3.2" height="5.6"/><path d="M8.4 11.6h3.2l-.5 3.6H8.9z"/></g><rect x="2.6" y="14.5" width="9.4" height="3.1" rx="1.55" fill="currentColor" opacity=".34"/></svg>
  </button>
  <button data-tool="e" aria-haspopup="true" aria-expanded="false">
    <svg class="ic-s" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.6 16.5l-4-4a1.8 1.8 0 010-2.6l5-5a1.8 1.8 0 012.6 0l3.8 3.8a1.8 1.8 0 010 2.6l-5 5H8.6z"/><path d="M5.5 18.6h11"/></svg>
    <svg class="ic-i" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.8 14.4L4.2 10.8a1.6 1.6 0 010-2.3l4.3-4.3a1.6 1.6 0 012.3 0l3.4 3.4a1.6 1.6 0 010 2.3l-4.3 4.3H7.8z"/><path d="M4.6 17.6h4.6"/><path d="M11.4 17.6h4.2" opacity=".35"/></svg>
  </button>

  <span class="ib-sep"></span>
  <!-- 黑板：一块带支架的板。它的动作是"把整页换成一块干净的黑板面"，所以画成板而不是画笔 -->
  <button data-act="board" aria-pressed="false">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.7" y="3.2" width="14.6" height="9.9" rx="1.7"/><path d="M10 13.1v3.4M6.7 16.5h6.6"/><path d="M5.6 6.4h5.2" opacity=".45"/></svg>
  </button>

  <span class="ib-sep"></span>
  <span id="inkcolors" style="display:flex;gap:5px;align-items:center;flex:none"></span>

  <span class="ib-sep"></span>
  <button data-act="undo">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 6.5H12a4.5 4.5 0 010 9H8"/><path d="M9.5 3.8L6.3 6.5l3.2 2.7"/></svg>
  </button>
  <button data-act="redo">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 6.5H8a4.5 4.5 0 000 9h4"/><path d="M10.5 3.8l3.2 2.7-3.2 2.7"/></svg>
  </button>
  <button data-act="clear">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h12M8 6.5V4.2h4v2.3M5.6 6.5l.8 10.2h7.2l.8-10.2"/></svg>
  </button>
  <button data-act="eye">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 10S5.2 5 10 5s7.8 5 7.8 5-3 5-7.8 5-7.8-5-7.8-5z"/><circle cx="10" cy="10" r="2.1"/></svg>
  </button>

  <span class="ib-sep"></span>
  <button data-act="png">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.8v9.4M6.4 8.8L10 12.4l3.6-3.6M3.4 16.6h13.2"/></svg>
  </button>
  <button data-act="json">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 3.4H5a1.6 1.6 0 00-1.6 1.6v10A1.6 1.6 0 005 16.6h10a1.6 1.6 0 001.6-1.6V12"/><path d="M12 8.2l5.4-5.4M17.4 2.8v4.2M17.4 2.8h-4.2"/></svg>
  </button>
  <button data-act="import">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.6 3.4H5a1.6 1.6 0 00-1.6 1.6v10A1.6 1.6 0 005 16.6h10a1.6 1.6 0 001.6-1.6V12"/><path d="M12 11.8l5.4 5.4M17.4 17.2V13M17.4 17.2h-4.2"/></svg>
  </button>
  <button data-act="help">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.4"/><path d="M8.1 7.9a2 2 0 113.5 1.6c-.9.8-1.6 1.2-1.6 2.3"/><circle cx="10" cy="14.4" r=".9" fill="currentColor" stroke="none"/></svg>
  </button>

    for (i = l.length - 1; i >= 0; i--){
      if (l[i].t === 'x') continue;
      if (hitStroke(l[i], mx, my)){ l.splice(i, 1); changed = true; save(); return; }
    }
  }

  cv.addEventListener('pointerdown', function(e){
    if (!on || e.button === 1) return;
    if (popOpen()) closePop();
    if (menuOpen()) closeMenu();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    hover = [e.clientX, e.clientY];
    liveKey = pkey();                                  /* lock the slide at pen-down */
    if (tool === 'e' && e.button !== 2 && emode === 'i'){
      mode = 'draw'; beginOp(liveKey);
      live = { t:'x', w:erSize(), pr:false, pts:[toNorm(e.clientX, e.clientY, 1)] }; q(); return;
    }
    if (tool === 'e' || e.button === 2){
      mode = 'erase'; beginOp(liveKey); eraseAt(e.clientX, e.clientY); q(); return;
    }
    var p = (e.pointerType === 'pen' && e.pressure > 0) ? e.pressure : .5;
    mode = 'draw'; beginOp(liveKey);
    live = { t:(tool === 'm' ? 'm' : 'p'), c:COLORS[ci], w:sizes[tool === 'm' ? 'm' : 'p'], pr:(e.pointerType === 'pen'), pts:[toNorm(e.clientX, e.clientY, p)] };
    q();
  });
  cv.addEventListener('pointermove', function(e){
    hover = [e.clientX, e.clientY];
    if (mode === 'erase') eraseAt(e.clientX, e.clientY);
    else if (live){
      var evs = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
      for (var i = 0; i < evs.length; i++){
        var p = (evs[i].pointerType === 'pen' && evs[i].pressure > 0) ? evs[i].pressure : .5;
        live.pts.push(toNorm(evs[i].clientX, evs[i].clientY, p));
      }
    }
    q();
  });
  function endPointer(){
    if (mode === 'erase') commitOp();
    else if (live && live.pts.length){ list(liveKey || pkey()).push(live); changed = true; commitOp(); save(); }
    live = null; liveKey = ''; snap = null; mode = ''; q();
    if (PV) { try { parent.focus(); } catch (e) {} }   /* hand keys back to the presenter window */
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('pointerleave', function(){ if (on && tool === 'e'){ hover = null; q(); } });
  cv.addEventListener('contextmenu', function(e){ if (on) e.preventDefault(); });

  /* ─── keys: paging is left ALONE (the deck keeps working); only our own keys
     and mouse/touch paging are handled ─────────────────────────────────────── */
  function ovOpen(){ return overview && overview.classList.contains('open'); }
  window.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey){
      if ((e.key === 'z' || e.key === 'Z') && !ovOpen()){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
      else if ((e.key === 'y' || e.key === 'Y') && !ovOpen()){ e.preventDefault(); redo(); }
      return;
    }
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)){
      if (e.key === 'Escape'){ closePop(); closeMenu(); }
      return;                                          /* arrows belong to the slider */
    }
    var k = e.key;
    if (ovOpen()){ if (k === 'a' || k === 'A') setOn(false); return; }
    if (k === '?' || (k === '/' && e.shiftKey)){ toggleHelp(); e.preventDefault(); e.stopImmediatePropagation(); return; }
    if (helpOpen() && k === 'Escape'){ toggleHelp(false); e.preventDefault(); e.stopImmediatePropagation(); return; }
    if (k === 'v' || k === 'V'){ setVisible(!visible); return; }
    if (k === 'a' || k === 'A'){ setOn(!on); hideHint(); return; }
    if (!on) return;
    if (k === 'Escape'){
      if (popOpen()) closePop(); else if (menuOpen()) closeMenu();
      else if (helpOpen()) toggleHelp(false); else setOn(false);
      e.preventDefault(); e.stopImmediatePropagation(); return;
    }
    if (k === 'p' || k === 'P') return pickTool('p');
    if (k === 'm' || k === 'M') return pickTool('m');
    if (k === 'e' || k === 'E'){ if (tool === 'e') cycleEraser(); else pickTool('e'); return; }
    if (k === 'b' || k === 'B') return toggleBoard();
    if (k === 'c' || k === 'C') return setColor((ci + 1) % COLORS.length);
    if (k === '[' || k === ']') return nudge(k === ']' ? 1 : -1);
    if (k === 'x' || k === 'X'){ clearPage(); return; }
    /* S is ours while annotating: the presenter window also listens for S on the deck page,
       and without this stop both would fire — a PNG download AND a popup window. Turn the
       annotation off (A) or click the presenter bubble when you want the window. */
    if (k === 's' || k === 'S'){ exportPNG(); e.preventDefault(); e.stopImmediatePropagation(); return; }
  }, true);

  /* clicks on the canvas must not reach the deck's click-half-to-page handler */
  function swallowClick(e){ if (on && e.target === cv){ e.stopImmediatePropagation(); if (e.cancelable) e.preventDefault(); } }
  function swallowTouch(e){ if (on && e.target === cv) e.stopImmediatePropagation(); }
  window.addEventListener('click', swallowClick, true);
  window.addEventListener('dblclick', swallowClick, true);
  ['touchstart', 'touchmove', 'touchend'].forEach(function(t){ window.addEventListener(t, swallowTouch, true); });
  window.addEventListener('pointerdown', function(e){
    if (!popOpen() && !menuOpen()) return;
    var el = e.target;
    if (el && el.closest && (el.closest('#inkpop') || el.closest('#inkmenu') || el.closest('#inkbar'))) return;
    closePop(); closeMenu();
  }, true);

  function setOn(v){
    on = !!v;
    document.body.classList.toggle('inking', on);
    document.body.classList.remove('tk-p', 'tk-m', 'tk-e');
    if (on) document.body.classList.add('tk-' + tool);
    live = null; hover = null; mode = ''; closePop(); closeMenu();
    var tg = bar.querySelector('[data-act="toggle"]');
    tg.setAttribute('aria-pressed', on ? 'true' : 'false');   /* the power glyph is an action, not a selected tool: no .on highlight */
    fab.setAttribute('aria-pressed', on ? 'true' : 'false');
    syncBar(); q();
    if (PV) { try { parent.postMessage({ type: 'ink-state', on: on }, '*'); } catch (e) {} }
  }
  function setTool(t){
    tool = t;
    document.body.classList.remove('tk-p', 'tk-m', 'tk-e');
    if (on) document.body.classList.add('tk-' + t);
    hover = null; syncBar(); q();
  }
  function setColor(i){ ci = i; syncBar(); }
  /* clicking the already-active tool opens its popover */
  function pickTool(t){
    if (t === 'e' && tool === 'e'){ menuOpen() ? closeMenu() : (setTool('e'), openMenu()); return; }
    if ((t === 'p' || t === 'm') && tool === t){
      if (popOpen() && popTool === t) closePop(); else { setTool(t); openPop(t); }
      return;
    }
    closePop(); closeMenu(); setTool(t);
  }
  function nudge(dir){
    var t = (tool === 'm') ? 'm' : 'p';
    setSize(t, sizes[t] + SIZE[t].nudge * dir);
    if (popOpen() && popTool === t) syncPop();
  }
  function fmt(v){ return String(Math.round(v * 10) / 10); }
  function setSize(t, v){
    var R = SIZE[t];
    v = Math.max(R.min, Math.min(R.max, Math.round(v / R.step) * R.step));
    sizes[t] = Math.round(v * 10) / 10; saveSizes();
  }

  function anchor(t){ return bar.querySelector('[data-tool="' + t + '"]'); }
  function place(el, btn){
    var r = btn.getBoundingClientRect();
    if (!r.width || !r.height) return;
    el.style.left = Math.round(r.left + r.width / 2) + 'px';
    el.style.bottom = Math.round((innerHeight || document.documentElement.clientHeight) - r.top + 10) + 'px';
  }
  function menuOpen(){ return menu.classList.contains('open'); }
  function popOpen(){ return pop.classList.contains('open'); }
  function openMenu(){ setTool('e'); menu.classList.add('open'); anchor('e').setAttribute('aria-expanded', 'true'); syncMenu(); place(menu, anchor('e')); }
  function closeMenu(){ menu.classList.remove('open'); var b = anchor('e'); if (b) b.setAttribute('aria-expanded', 'false'); }
  function syncMenu(){
    var it = menu.querySelectorAll('[data-emode]');
    for (var i = 0; i < it.length; i++){
      var sel = it[i].getAttribute('data-emode') === emode;
      it[i].classList.toggle('on', sel); it[i].setAttribute('aria-checked', sel ? 'true' : 'false');
    }
  }
  function setEraser(m){ emode = (m === 'i') ? 'i' : 's'; syncEraser(); syncMenu(); q(); }
  function cycleEraser(){ closeMenu(); setEraser(emode === 's' ? 'i' : 's'); say(L.tEr.replace('%s', emode === 's' ? L.erS : L.erI)); }
  function syncEraser(){ document.body.classList.toggle('er-i', emode === 'i'); }
  function openPop(t){ closeMenu(); popTool = t; pop.classList.add('open'); syncPop(); place(pop, anchor(t)); }
  function closePop(){ pop.classList.remove('open'); popTool = ''; }
  function syncPop(){
    var t = popTool === 'm' ? 'm' : 'p', R = SIZE[t];
    pr.min = R.min; pr.max = R.max; pr.step = R.step; pr.value = sizes[t];
    pv.textContent = fmt(sizes[t]);
  }
  pr.addEventListener('input', function(){
    if (!popTool) return;
    setSize(popTool, pr.value); pv.textContent = fmt(sizes[popTool]); q();
  });
  pr.addEventListener('change', function(){ pr.blur(); });

  function clearPage(){
    var k = pkey(), l = store[k] || [];
    if (!l.length) return;
    beginOp(k); store[k] = []; changed = true; commitOp(); save(); q();
  }
  function helpOpen(){ return helpEl.classList.contains('open'); }
  function toggleHelp(v){ helpEl.classList.toggle('open', v === undefined ? !helpOpen() : v); syncBar(); }
  function setVisible(v){ visible = !!v; q(); }

  function dl(href, name){
    var a = document.createElement('a');
    a.href = href; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ if (a.parentNode) a.parentNode.removeChild(a); }, 0);
  }
  function exportPNG(){
    live = null; hover = null; mode = ''; closePop(); closeMenu(); draw();
    var name = board ? L.filePngBoard.replace('%s', DOC)
                     : L.filePng.replace('%s', DOC).replace('%d', curPage() + 1);
    try { dl(cv.toDataURL('image/png'), name); }
    catch (e) { say(L.tPng); }
    q();
  }
  function exportJSON(){
    var url = URL.createObjectURL(new Blob([JSON.stringify(store)], { type:'application/json' }));
    dl(url, L.fileJson.replace('%s', DOC));
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  function importJSON(f){
    var fr = new FileReader();
    fr.onload = function(){
      try {
        var o = JSON.parse(fr.result), n = 0;
        if (!o || typeof o !== 'object' || o.length) throw 0;
        for (var k in o) if (/^p\d+$/.test(k) && o[k] && o[k].length){ store[k] = o[k]; n += o[k].length; }
        save(); q(); say(L.tImp.replace('%s', n));
      } catch (e) { say(L.tImpBad); }
    };
    fr.readAsText(f);
  }

  /* ─── colour swatches (+ the custom slot), rebuilt whenever the mode changes ──
     The board is always the same dark slate and keeps its own chalk set (PALETTE_BOARD):
     a pen tuned for this deck may be near-black, and near-black is exactly what vanishes
     on a blackboard. Same count and same order in both sets, so "colour 3" stays in the
     same place on screen. Rebuilding drops the stale swatches and the stale <input type=color> with them. */
  var colorsWrap = document.getElementById('inkcolors');
  var cp = null;
  function buildSwatches(){
    COLORS = (board ? PALETTE_BOARD : PALETTE).concat([loadCustom()]);
    NAMES = board ? L.namesBoard : L.names;
    colorsWrap.innerHTML = '';
    COLORS.forEach(function(c, i){
      var b = document.createElement('button');
      b.className = 'sw' + (i === CUSTOM ? ' custom' : ''); b.style.background = c;
      b.setAttribute('data-color', i);
      b.setAttribute('aria-label', (NAMES[i] || c) + ' pen');
      colorsWrap.appendChild(b);
    });
    cp = document.createElement('input');
    cp.type = 'color'; cp.value = COLORS[CUSTOM]; cp.setAttribute('aria-label', L.ariaCustom);
    colorsWrap.appendChild(cp);
    cp.addEventListener('input', function(){
      COLORS[CUSTOM] = cp.value;
      var sw = colorsWrap.querySelector('[data-color="' + CUSTOM + '"]');
      if (sw) sw.style.background = cp.value;
      if (ci === CUSTOM) q();
    });
    cp.addEventListener('change', function(){
      COLORS[CUSTOM] = cp.value;
      try { localStorage.setItem(LS_COLOR, cp.value); } catch (e) {}
      cp.blur();
    });
  }
  buildSwatches();
  function pickCustom(){ setColor(CUSTOM); cp.value = COLORS[CUSTOM]; cp.click(); }

  /* ─── blackboard: one light sheet over the whole page ─────────────────────── */
  function setBoard(v){
    v = (v === undefined) ? !board : !!v;
    if (v === board) return;
    board = v;
    document.body.classList.toggle('board', board);
    buildSwatches();                       /* a light board needs light-mode inks */
    var b = bar.querySelector('[data-act="board"]');
    if (b){ b.classList.toggle('on', board); b.setAttribute('aria-pressed', board ? 'true' : 'false');
      b.title = board ? L.backToSlides : L.board; }
    var c = bar.querySelector('[data-act="clear"]');
    if (c) c.title = board ? L.clearBoard : L.clear;
    say(board ? L.tBoard : L.tSlide);
    closePop(); closeMenu();
    syncBar(); q();
  }
  function toggleBoard(){ setBoard(!board); }

  bar.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tool) pickTool(b.dataset.tool);
    else if (b.dataset.color !== undefined){
      if (+b.dataset.color === CUSTOM) pickCustom(); else setColor(+b.dataset.color);
    }
    else switch (b.dataset.act){
      case 'toggle': setOn(!on); break;
      case 'undo': undo(); break;
      case 'redo': redo(); break;
      case 'clear': clearPage(); break;
      case 'board': toggleBoard(); break;
      case 'eye': setVisible(!visible); break;
      case 'png': exportPNG(); break;
      case 'json': exportJSON(); break;
      case 'import': fileEl.click(); break;
      case 'help': toggleHelp(); break;
    }
  });
  menu.addEventListener('click', function(e){
    var b = e.target.closest('button[data-emode]'); if (!b) return;
    setEraser(b.dataset.emode); closeMenu();
  });
  /* the corner button is draggable: hold and move to park it anywhere (remembered per
     deck in ink.v1.fab|<title>); a plain click still starts annotation; double-click
     forgets the parked position */
  var fabPos = null, fabDragged = false;
  function clampFab(p){
    var w = fab.offsetWidth || 42, h = fab.offsetHeight || 42;
    var mx = Math.max(0, (innerWidth || document.documentElement.clientWidth) - w);
    var my = Math.max(0, (innerHeight || document.documentElement.clientHeight) - h);
    return { x: Math.min(Math.max(4, p.x), mx - 4), y: Math.min(Math.max(4, p.y), my - 4) };
  }
  function applyFabPos(){
    if (!fabPos){ fab.style.left = fab.style.top = fab.style.right = fab.style.bottom = ''; return; }
    fab.style.right = fab.style.bottom = 'auto';
    fab.style.left = fabPos.x + 'px'; fab.style.top = fabPos.y + 'px';
  }
  function loadFab(){
    try {
      var s = JSON.parse(localStorage.getItem(LS_FAB) || 'null');
      if (s && isFinite(+s.x) && isFinite(+s.y)) fabPos = clampFab({ x: +s.x, y: +s.y });
    } catch (e) {}
    applyFabPos();
  }
  fab.addEventListener('pointerdown', function(e){
    if (e.button !== 0) return;
    var r = fab.getBoundingClientRect(), sx = e.clientX, sy = e.clientY, ox = r.left, oy = r.top, moved = false;
    try { fab.setPointerCapture(e.pointerId); } catch (err) {}
    function mv(ev){
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
      if (!moved){ moved = true; fab.classList.add('dragging'); }
      fabPos = clampFab({ x: ox + (ev.clientX - sx), y: oy + (ev.clientY - sy) });
      applyFabPos();
    }
    function up(){
      fab.classList.remove('dragging');
      fab.removeEventListener('pointermove', mv);
      fab.removeEventListener('pointerup', up);
      fab.removeEventListener('pointercancel', up);
      if (moved){
        fabDragged = true;                              /* swallow the click that follows */
        setTimeout(function(){ fabDragged = false; }, 0);
        try { localStorage.setItem(LS_FAB, JSON.stringify(fabPos)); } catch (err) {}
      }
    }
    fab.addEventListener('pointermove', mv);
    fab.addEventListener('pointerup', up);
    fab.addEventListener('pointercancel', up);
  });
  fab.addEventListener('dblclick', function(){
    fabPos = null;
    try { localStorage.removeItem(LS_FAB); } catch (e) {}
    applyFabPos();
  });
  fab.addEventListener('click', function(){ if (fabDragged) return; setOn(true); hideHint(); });
  fileEl.addEventListener('change', function(){ if (fileEl.files && fileEl.files[0]) importJSON(fileEl.files[0]); fileEl.value = ''; });

  /* every ink surface stops its own gestures: the deck's paging handlers live on
     document, and stopPropagation at window capture would kill our own handlers too */
  function isolate(el){
    ['click', 'dblclick', 'auxclick', 'pointerdown', 'touchstart', 'touchmove', 'touchend'].forEach(function(t){
      el.addEventListener(t, function(e){ e.stopPropagation(); });
    });
  }
  /* the board is a plain div over the deck: without isolate() a click on it would bubble
     to document and page the deck it is covering */
  [bar, fab, menu, pop, hintEl, helpEl, statusEl, boardEl].forEach(isolate);

  function mark(sel, yes){ var el = bar.querySelector(sel); if (el) el.classList.toggle('on', !!yes); }
  function syncBar(){
    ['p', 'm', 'e'].forEach(function(t){ mark('[data-tool="' + t + '"]', t === tool); });
    COLORS.forEach(function(c, i){ mark('[data-color="' + i + '"]', i === ci); });
    mark('[data-act="eye"]', !visible); mark('[data-act="help"]', helpOpen());
  }

  /* labels + tooltips + help card, all from L */
  function paint(){
    bar.setAttribute('aria-label', L.ariaBar);
    pop.setAttribute('aria-label', L.ariaPop);
    pr.setAttribute('aria-label', L.ariaPop);
    fab.title = L.fab; bar.querySelector('[data-act="toggle"]').title = L.toggle;
    bar.querySelector('[data-tool="p"]').title = L.pen;
    bar.querySelector('[data-tool="m"]').title = L.marker;
    bar.querySelector('[data-tool="e"]').title = L.eraser;
    ['undo', 'redo', 'clear', 'eye', 'png', 'json', 'import', 'help', 'board'].forEach(function(a){
      var b = bar.querySelector('[data-act="' + a + '"]'); if (b) b.title = L[a];
    });
    var sw = colorsWrap.querySelectorAll('.sw');
    for (var i = 0; i < sw.length; i++) sw[i].title = NAMES[i] || COLORS[i];
    menu.innerHTML = L.er.map(function(e2, i){
      return '<button role="menuitemradio" data-emode="' + (i ? 'i' : 's') + '">'
        + '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
        + (i ? '<path d="M7.8 14.4L4.2 10.8a1.6 1.6 0 010-2.3l4.3-4.3a1.6 1.6 0 012.3 0l3.4 3.4a1.6 1.6 0 010 2.3l-4.3 4.3H7.8z"/><path d="M4.6 17.6h4.6"/><path d="M11.4 17.6h4.2" opacity=".35"/>'
               : '<path d="M8.6 16.5l-4-4a1.8 1.8 0 010-2.6l5-5a1.8 1.8 0 012.6 0l3.8 3.8a1.8 1.8 0 010 2.6l-5 5H8.6z"/><path d="M5.5 18.6h11"/>')
        + '</svg><b>' + e2[0] + '</b></button>';
    }).join('');
    hintEl.innerHTML = L.hint;
    helpEl.innerHTML = '<h4>' + L.helpTitle + '</h4><p class="sub">' + L.helpSub + '</p><div class="hg">'
      + L.helpRows.map(function(r){ return '<div class="hr"><span>' + r[0] + '</span><kbd>' + r[1] + '</kbd></div>'; }).join('')
      + '</div><div class="hfoot"><span>' + L.helpFoot + '</span><b>' + L.helpBackup + '</b></div>';
  }

  function sync(){ var p = curPage(); if (p !== lastPage) lastPage = p; q(); }
  if (window.MutationObserver && viewport)
    new MutationObserver(sync).observe(viewport, { subtree:true, attributes:true, attributeFilter:['class'] });
  /* registered after deck-shell.js, so fit() has already run — redraw synchronously,
     rAF is paused in hidden tabs */
  window.addEventListener('resize', function(){ resize(); sync(); if (fabPos){ fabPos = clampFab(fabPos); applyFabPos(); } if (menuOpen()) place(menu, anchor('e')); if (popOpen()) place(pop, anchor(popTool)); });
  document.addEventListener('fullscreenchange', function(){ setTimeout(function(){ closePop(); closeMenu(); resize(); sync(); }, 60); });

  function hideHint(){ hintEl.classList.add('off'); try { localStorage.setItem(LS_HINT, '1'); } catch (e) {} }
  var seen = false;
  try { seen = !!localStorage.getItem(LS_HINT); } catch (e) {}
  if (PV || seen) hintEl.classList.add('off'); else setTimeout(hideHint, 14000);
  hintEl.addEventListener('click', function(){ setOn(true); hideHint(); });

  paint(); resize(); sync(); syncBar(); syncEraser(); syncMenu(); loadFab();
  /* the presenter's board card loads this file with &board=1: the board is up from the
     first frame and annotation is already live, so the speaker can draw immediately */
  if (PV_BOARD){ setBoard(true); setOn(true); }
  /* register this layer's keys with the shell's Q panel (see deck-shell.js) */
  if (window.__deckHelp) window.__deckHelp.push({
    title: L.helpTitle,
    rows: L.helpRows.slice(0, -1).map(function (r) { return [r[1], r[0]]; })
  });
  window.InkOverlay = { get:function(){ return store; }, on:setOn, undo:undo, redo:redo, tool:pickTool,
    clear:clearPage, visible:setVisible, page:curPage, eraser:function(){ return emode; }, setEraser:setEraser,
    size:function(t){ return sizes[t === 'm' ? 'm' : 'p']; }, setSize:setSize,
    pop:function(){ return popOpen() ? popTool : ''; }, redraw:draw,
    board:function(){ return board; }, setBoard:setBoard,
    applyRemote:applyRemote, state:function(){ return { store:store, rev:REV, on:on, board:board }; },
    fab:function(){ return fabPos; }, resetFab:function(){ fabPos = null; try { localStorage.removeItem(LS_FAB); } catch (e) {} applyFabPos(); } };
})();
</script>
